version: '3.8'

services:
  postgres_test:
    image: postgres:16-alpine
    container_name: whatsapp-saas-postgres-test
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: whatsapp_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d whatsapp_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
